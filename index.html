<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
        <title>ASCII 视频转换器</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #008080;
                font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, SimSun, "宋体", sans-serif;
                font-size: 11px;
                color: #000
            }

            .app {
                display: flex;
                gap: 8px;
                padding: 8px;
                height: 100%;
                width: 100%
            }

            .panel {
                background: #c0c0c0;
                border: 1px solid #000;
                box-shadow: inset 1px 1px 0 #dfdfdf, inset 2px 2px 0 #fff, inset -1px -1px 0 #808080, inset -2px -2px 0 #000;
                display: flex;
                flex-direction: column;
                min-height: 0
            }

            .tb {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #000080;
                background: linear-gradient(90deg, #000080, #1084d0);
                color: #fff;
                font-size: 11px;
                font-weight: 700;
                padding: 2px 4px;
                margin: 2px;
                letter-spacing: .5px
            }

            .tbk {
                font-weight: 400;
                letter-spacing: 2px;
                font-family: "Courier New", monospace;
                opacity: .95
            }

            .pb {
                padding: 6px 8px 8px;
                overflow: auto;
                min-height: 0
            }

            #winMain {
                flex: 0 0 292px
            }

            #winView {
                flex: 1;
                min-width: 0
            }

            .row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 7px;
                flex-wrap: wrap
            }

            .lbl {
                width: 52px;
                flex: 0 0 52px;
                font-size: 11px
            }

            .btn {
                background: #c0c0c0;
                border: 1px solid #000;
                box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080, inset 2px 2px 0 #dfdfdf, inset -2px -2px 0 #808080;
                color: #000;
                font-size: 11px;
                font-family: inherit;
                padding: 4px 10px;
                border-radius: 0;
                cursor: pointer;
                min-height: 26px
            }

            .btn:active {
                box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff, inset 2px 2px 0 #000;
                padding: 5px 9px 3px 11px
            }

            .btn:disabled {
                color: #808080;
                text-shadow: 1px 1px 0 #fff;
                cursor: default
            }

            .btn.main {
                font-weight: 700
            }

            .fill {
                flex: 1
            }

            .field {
                background: #fff;
                border: 1px solid #000;
                box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff, inset 2px 2px 0 #000;
                padding: 2px 4px;
                font-size: 11px;
                font-family: inherit;
                height: 22px;
                min-width: 0
            }

            select.field {
                height: 22px
            }

            input[type=range] {
                -webkit-appearance: none;
                appearance: none;
                height: 18px;
                background: transparent;
                flex: 1;
                min-width: 80px
            }

            input[type=range]::-webkit-slider-runnable-track {
                height: 6px;
                background: #fff;
                border: 1px solid #000;
                box-shadow: inset 1px 1px 0 #808080
            }

            input[type=range]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 12px;
                height: 18px;
                background: #c0c0c0;
                border: 1px solid #000;
                box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
                margin-top: -7px
            }

            .chk {
                display: flex;
                align-items: center;
                gap: 4px
            }

            .chk input {
                width: 14px;
                height: 14px
            }

            .title-sm {
                font-size: 11px;
                font-weight: 700;
                margin: 8px 0 5px;
                border-bottom: 1px solid #808080;
                padding-bottom: 3px
            }

            .info {
                font-size: 10px;
                color: #000080;
                line-height: 1.5;
                word-break: break-all
            }

            #out {
                display: none;
                flex: 1;
                background: #000;
                border: 1px solid #000;
                box-shadow: inset 2px 2px 0 #000, inset -1px -1px 0 #fff;
                margin: 2px;
                padding: 4px;
                overflow: hidden;
                color: #e6e6e6
            }

            #art {
                white-space: pre;
                font-family: "Courier New", Courier, monospace;
                line-height: 1;
                letter-spacing: 0;
                flex: 0 0 auto
            }

            #drop {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                background: #000;
                border: 1px solid #000;
                box-shadow: inset 2px 2px 0 #000, inset -1px -1px 0 #fff;
                margin: 2px;
                color: #9fb8b8;
                font-size: 12px;
                text-align: center;
                padding: 20px
            }

            #drop b {
                color: #fff;
                font-size: 14px
            }

            .bar {
                height: 15px;
                background: #fff;
                border: 1px solid #000;
                box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff, inset 2px 2px 0 #000;
                padding: 2px;
                flex: 1;
                min-width: 60px
            }

            .fill-blue {
                height: 100%;
                width: 0;
                background: #000080
            }

            .status {
                font-size: 10px;
                color: #000;
                margin-top: 6px;
                min-height: 26px;
                line-height: 1.4
            }

            @media (max-width:920px) {
                .app {
                    flex-direction: column;
                    gap: 6px
                }

                #winMain {
                    flex: 0 0 auto;
                    max-height: 46%
                }

                #winView {
                    flex: 1
                }

                .lbl {
                    width: 44px;
                    flex: 0 0 44px
                }
            }

        </style>
    </head>

    <body>
        <div class="app">
            <div class="panel" id="winMain">
                <div class="tb"><span>ASCII · 转换器</span><span class="tbk">_ □ ✕</span></div>
                <div class="pb">
                    <div class="row">
                        <span class="lbl">视频</span>
                        <label class="btn fill" style="text-align:center;flex:1">
                            选择文件
                            <input type="file" id="file" accept="video/*" style="display:none">
                        </label>
                    </div>
                    <div class="info" id="fname">未选择文件</div>

                    <div class="title-sm">输出参数</div>
                    <div class="row">
                        <span class="lbl">列数</span>
                        <input type="range" id="cols" min="30" max="200" value="96" step="2">
                        <span id="colsV" style="width:26px;text-align:right">96</span>
                    </div>
                    <div class="row">
                        <span class="lbl">字符集</span>
                        <select class="field fill" id="charset">
                            <option value="c10">经典 10 级　.:-=+*#%@</option>
                            <option value="c16" selected>细腻 16 级　.'`-:~=+*?%$#&amp;@</option>
                            <option value="blocks">方块　░▒▓█</option>
                            <option value="bin">二值　█</option>
                        </select>
                    </div>
                    <div class="row">
                        <span class="lbl">色彩</span>
                        <div class="chk"><input type="checkbox" id="color" checked><label for="color">彩色</label></div>
                        <div class="chk"><input type="checkbox" id="invert"><label for="invert">反相</label></div>
                    </div>
                    <div class="row">
                        <span class="lbl">声音</span>
                        <div class="chk"><input type="checkbox" id="sound" checked><label for="sound">原声</label></div>
                        <input type="range" id="vol" min="0" max="100" value="60" step="2" style="flex:1">
                        <span id="volV" style="width:26px;text-align:right">60</span>
                    </div>
                    <div class="row">
                        <span class="lbl">亮度</span>
                        <input type="range" id="bright" min="-60" max="60" value="0" step="2">
                        <span id="brightV" style="width:26px;text-align:right">0</span>
                    </div>
                    <div class="row">
                        <span class="lbl">对比</span>
                        <input type="range" id="contrast" min="50" max="220" value="100" step="5">
                        <span id="contrastV" style="width:26px;text-align:right">1.0</span>
                    </div>

                    <div class="title-sm">播放</div>
                    <div class="row">
                        <button class="btn main fill" id="play">▶ 播放</button>
                        <button class="btn" id="pausev">暂停</button>
                    </div>
                    <div class="row">
                        <div class="bar">
                            <div class="fill-blue" id="progFill"></div>
                        </div>
                        <span id="timeV" style="width:78px;text-align:right;font-size:10px">0:00 / 0:00</span>
                    </div>
                    <div class="row">
                        <input type="range" id="seek" min="0" max="1000" value="0" step="1" style="width:100%">
                    </div>

                    <div class="title-sm">导出</div>
                    <div class="row">
                        <button class="btn fill" id="expTxt">存当前帧 TXT</button>
                        <button class="btn fill" id="expFrame">存当前帧 HTML</button>
                    </div>
                    <div class="row">
                        <button class="btn fill" id="expAnim">导出动画 HTML</button>
                    </div>
                    <div class="row">
                        <button class="btn fill" id="record">录制 WebM</button>
                        <button class="btn" id="copy">复制</button>
                    </div>
                    <div class="status" id="status">选择视频后即可转换，全部在本机处理，不上传。</div>
                </div>
            </div>

            <div class="panel" id="winView">
                <div class="tb"><span>OUTPUT · 字符画面</span><span class="tbk">□</span></div>
                <div id="out">
                    <div id="art"></div>
                </div>
                <div id="drop">
                    <b>ASCII VIDEO</b>
                    <span>点左侧「选择文件」载入视频<br>或者把视频拖进这个窗口</span>
                </div>
            </div>
        </div>

        <video id="vid" playsinline webkit-playsinline style="display:none"></video>

        <script>
            const CHARSETS = {
  c10: " .:-=+*#%@",
  c16: " .'`-:~=+*?%$#&@",
  blocks: " ░▒▓█",
  bin: " █"
};

const E = {
  file: document.getElementById('file'),
  fname: document.getElementById('fname'),
  cols: document.getElementById('cols'),
  colsV: document.getElementById('colsV'),
  charset: document.getElementById('charset'),
  color: document.getElementById('color'),
  invert: document.getElementById('invert'),
  bright: document.getElementById('bright'),
  brightV: document.getElementById('brightV'),
  contrast: document.getElementById('contrast'),
  contrastV: document.getElementById('contrastV'),
  sound: document.getElementById('sound'),
  vol: document.getElementById('vol'),
  volV: document.getElementById('volV'),
  play: document.getElementById('play'),
  pausev: document.getElementById('pausev'),
  progFill: document.getElementById('progFill'),
  timeV: document.getElementById('timeV'),
  seek: document.getElementById('seek'),
  out: document.getElementById('out'),
  art: document.getElementById('art'),
  drop: document.getElementById('drop'),
  status: document.getElementById('status'),
  expTxt: document.getElementById('expTxt'),
  expFrame: document.getElementById('expFrame'),
  expAnim: document.getElementById('expAnim'),
  record: document.getElementById('record'),
  copy: document.getElementById('copy')
};

const vid = document.getElementById('vid');
const sample = document.createElement('canvas');
const sctx = sample.getContext('2d', { willReadFrequently: true });

let COLS = 96;
let ROWS = 32;
let fs = 12;
let loaded = false;
let playing = false;
let rafId = 0;
let lastStamp = -1;
let rec = null;
let recChunks = [];
let recCanvas = null;
let recCtx = null;
let recLoop = 0;
let busy = false;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function fmtTime(t) {
  if (!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function say(msg) { E.status.textContent = msg; }

function setRows() {
  if (!loaded) return;
  const ratio = vid.videoHeight / vid.videoWidth || 0.5625;
  ROWS = Math.max(6, Math.round(COLS * 0.6 * ratio));
}
function fitFont() {
  const w = E.out.clientWidth - 12;
  const h = E.out.clientHeight - 12;
  if (w <= 0 || h <= 0) return;
  fs = Math.min(w / (COLS * 0.6), h / ROWS);
  fs = Math.max(2, fs);
  E.art.style.fontSize = fs.toFixed(2) + 'px';
  E.art.style.lineHeight = fs.toFixed(2) + 'px';
  E.out.style.display = 'flex';
  E.out.style.alignItems = 'center';
  E.out.style.justifyContent = 'center';
}

function pixelMode() {
  return !E.color.checked;
}

function renderFrame() {
  if (!loaded) return '';
  if (sample.width !== COLS || sample.height !== ROWS) {
    sample.width = COLS;
    sample.height = ROWS;
  }
  sctx.drawImage(vid, 0, 0, COLS, ROWS);
  const img = sctx.getImageData(0, 0, COLS, ROWS).data;
  const set = CHARSETS[E.charset.value] || CHARSETS.c16;
  const last = set.length - 1;
  const bright = Number(E.bright.value) / 100;
  const contrast = Number(E.contrast.value) / 100;
  const inv = E.invert.checked;
  const color = !pixelMode();

  const lines = [];

  for (let y = 0; y < ROWS; y++) {
    if (!color) {
      let row = '';
      for (let x = 0; x < COLS; x++) {
        const i = (y * COLS + x) * 4;
        let lum = (img[i] * 0.299 + img[i + 1] * 0.587 + img[i + 2] * 0.114) / 255;
        lum = clamp((lum - 0.5) * contrast + 0.5 + bright, 0, 1);
        if (inv) lum = 1 - lum;
        row += set[clamp(Math.floor(lum * last + 0.0001), 0, last)];
      }
      lines.push(row);
    } else {
      let rowHtml = '';
      let buf = '';
      let lastCol = '';
      for (let x = 0; x < COLS; x++) {
        const i = (y * COLS + x) * 4;
        let lum = (img[i] * 0.299 + img[i + 1] * 0.587 + img[i + 2] * 0.114) / 255;
        lum = clamp((lum - 0.5) * contrast + 0.5 + bright, 0, 1);
        if (inv) lum = 1 - lum;
        const ch = set[clamp(Math.floor(lum * last + 0.0001), 0, last)];
        const qr = ((clamp(Math.round(img[i] * 1.08), 0, 255) >> 3) << 3) | 4;
        const qg = ((clamp(Math.round(img[i + 1] * 1.08), 0, 255) >> 3) << 3) | 4;
        const qb = ((clamp(Math.round(img[i + 2] * 1.08), 0, 255) >> 3) << 3) | 4;
        const col = 'rgb(' + qr + ',' + qg + ',' + qb + ')';
        if (col !== lastCol && buf.length) {
          rowHtml += '<span style="color:' + lastCol + '">' + buf + '</span>';
          buf = '';
        }
        lastCol = col;
        buf += ch;
      }
      if (buf.length) rowHtml += '<span style="color:' + lastCol + '">' + buf + '</span>';
      lines.push(rowHtml);
    }
  }
  if (!color) return lines.join('\n');
  return lines.join('\n');
}

let lastText = '';
let lastMode = '';
function drawFrame() {
  if (!loaded) return;
  const t = renderFrame();
  if (!t) return;
  if (pixelMode()) {
    if (lastMode !== 'mono' || lastText !== t) {
      E.art.textContent = t;
      lastText = t;
      lastMode = 'mono';
    }
  } else {
    E.art.innerHTML = t;
    lastText = t;
    lastMode = 'color';
  }
}

function tick() {
  rafId = 0;
  if (!loaded || !playing) return;
  const ct = vid.currentTime;
  if (ct !== lastStamp) {
    lastStamp = ct;
    drawFrame();
    if (videoMeta()) updateTransport();
  }
  if (rec && recCtx) drawToRecordCanvas();
  rafId = requestAnimationFrame(tick);
}

function videoMeta() { return vid.duration && isFinite(vid.duration); }

function updateTransport() {
  const d = vid.duration;
  if (!d || !isFinite(d)) return;
  const p = clamp(vid.currentTime / d, 0, 1);
  E.progFill.style.width = (p * 100).toFixed(1) + '%';
  E.seek.value = String(Math.round(p * 1000));
  E.timeV.textContent = fmtTime(vid.currentTime) + ' / ' + fmtTime(d);
}

let AC = null, srcNode = null, gainNode = null, msDest = null;
function ensureAudio() {
  try {
    if (!AC) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return false;
      AC = new Ctor();
      srcNode = AC.createMediaElementSource(vid);
      gainNode = AC.createGain();
      srcNode.connect(gainNode);
      gainNode.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return true;
  } catch (e) { AC = null; return false; }
}
function applyVolume() {
  if (gainNode) gainNode.gain.value = E.sound.checked ? Number(E.vol.value) / 100 : 0;
}

function play() {
  if (!loaded) { say('先选择一个视频文件。'); return; }
  ensureAudio();
  vid.muted = false;
  applyVolume();
  playing = true;
  vid.play().then(function () {
    E.play.textContent = '▶ 播放中';
    if (!rafId) rafId = requestAnimationFrame(tick);
    say('正在转换…');
  }).catch(function () {
    playing = false;
    say('Safari 需要再点一次播放按钮。');
  });
}
function pause() {
  playing = false;
  vid.pause();
  E.play.textContent = '▶ 播放';
}

E.play.addEventListener('click', function () { if (playing) pause(); else play(); });
E.vol.addEventListener('input', function () {
  E.volV.textContent = E.vol.value;
  applyVolume();
});
E.sound.addEventListener('change', function () {
  applyVolume();
  say(E.sound.checked ? '原声开。导出的动画也会带音轨。' : '已静音。');
});
E.pausev.addEventListener('click', pause);

function loadFile(file) {
  if (!file) return;
  if (!/^video\//.test(file.type) && !/\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name)) {
    say('这不是视频文件。');
    return;
  }
  pause();
  const url = URL.createObjectURL(file);
  vid.src = url;
  vid.load();
  E.fname.textContent = file.name + '　' + (file.size / 1048576).toFixed(1) + ' MB';
  loaded = false;
  say('正在读取视频信息…');
}

vid.addEventListener('loadedmetadata', function () {
  loaded = true;
  E.drop.style.display = 'none';
  E.out.style.display = 'flex';
  setRows();
  fitFont();
  drawFrame();
  updateTransport();
  say('已载入 · ' + vid.videoWidth + '×' + vid.videoHeight + ' · ' + fmtTime(vid.duration) + '　点播放开始转换');
});

vid.addEventListener('error', function () {
  say('这个视频 Safari 解不开，换 mp4（H.264）试试。');
});

vid.addEventListener('seeked', function () {
  lastStamp = -1;
  if (!playing) { drawFrame(); updateTransport(); }
});

vid.addEventListener('timeupdate', updateTransport);

E.seek.addEventListener('input', function () {
  if (!loaded) return;
  const d = vid.duration;
  if (!isFinite(d)) return;
  pause();
  vid.currentTime = (Number(E.seek.value) / 1000) * d;
  updateTransport();
});

E.file.addEventListener('change', function (e) {
  loadFile(e.target.files && e.target.files[0]);
});

E.drop.addEventListener('dragover', function (e) { e.preventDefault(); });
E.drop.addEventListener('drop', function (e) {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});
E.out.addEventListener('dragover', function (e) { e.preventDefault(); });
E.out.addEventListener('drop', function (e) {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

E.cols.addEventListener('input', function () {
  COLS = Number(E.cols.value);
  E.colsV.textContent = COLS;
  setRows();
  fitFont();
  if (loaded) drawFrame();
});
E.charset.addEventListener('change', function () { if (loaded) drawFrame(); });
E.color.addEventListener('change', function () { if (loaded) drawFrame(); });
E.invert.addEventListener('change', function () { if (loaded) drawFrame(); });
E.bright.addEventListener('input', function () {
  E.brightV.textContent = E.bright.value;
  if (loaded) drawFrame();
});
E.contrast.addEventListener('input', function () {
  E.contrastV.textContent = (Number(E.contrast.value) / 100).toFixed(1);
  if (loaded) drawFrame();
});
window.addEventListener('resize', function () {
  fitFont();
  if (loaded) drawFrame();
});
window.addEventListener('orientationchange', function () {
  setTimeout(function () { fitFont(); if (loaded) drawFrame(); }, 220);
});

function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 2000);
}
function baseName() {
  const n = E.fname.textContent.split('　')[0];
  return (n || 'ascii').replace(/\.[^.]+$/, '');
}

E.expTxt.addEventListener('click', function () {
  if (!loaded) { say('还没有视频。'); return; }
  pause();
  const t = renderFrame();
  if (!t) { say('这一帧是空的。'); return; }
  download(baseName() + '-frame.txt', t);
  say('已导出当前帧 TXT（黑白文本）。');
});

E.expFrame.addEventListener('click', function () {
  if (!loaded) { say('还没有视频。'); return; }
  pause();
  const t = renderFrame();
  const w = COLS, h = ROWS;
  const page = buildPlayerHtml([t], 1, w, h, '');
  download(baseName() + '-frame.html', page, 'text/html;charset=utf-8');
  say('已导出单帧 HTML。');
});

E.copy.addEventListener('click', function () {
  if (!loaded) return;
  const t = renderFrame();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { say('已复制当前帧文本。'); }).catch(function () { say('剪贴板被拒绝，用 TXT 导出吧。'); });
  } else {
    say('这个浏览器不支持剪贴板，用 TXT 导出吧。');
  }
});

function encodeWav(buf) {
  const n = buf.length;
  const pcm = buf.getChannelData(0);
  const bytes = 44 + n * 2;
  const ab = new ArrayBuffer(bytes);
  const v = new DataView(ab);
  const str = function (off, x) { for (let i = 0; i < x.length; i++) v.setUint8(off + i, x.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, bytes - 8, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    let x = pcm[i];
    if (x > 1) x = 1; else if (x < -1) x = -1;
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
    o += 2;
  }
  const u8 = new Uint8Array(ab);
  let out = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) {
    out += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + CH, u8.length)));
  }
  return btoa(out);
}

async function extractAudio(limitSec) {
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) throw new Error('no audio ctx');
  const ab = await (await fetch(vid.src)).arrayBuffer();
  const ac2 = new Ctor();
  const buf = await new Promise(function (res, rej) {
    try { ac2.decodeAudioData(ab, res, rej); } catch (e) { rej(e); }
  });
  const sr = 16000;
  const frames = Math.max(1, Math.min(Math.ceil(buf.duration * sr), Math.ceil(limitSec * sr)));
  const off = new OfflineAudioContext(1, frames, sr);
  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start(0);
  const r = await off.startRendering();
  try { ac2.close(); } catch (e) {}
  return encodeWav(r);
}

function buildPlayerHtml(frames, fps, w, h, audio) {
  const data = JSON.stringify(frames);
  const A = audio ? 'data:audio/wav;base64,' + audio : '';
  const parts = [];
  parts.push('<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n');
  parts.push('<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>ASCII 动画</title>\n<style>\n');
  parts.push('*{margin:0;padding:0;box-sizing:border-box}\n');
  parts.push('html,body{width:100%;height:100%;background:#000;overflow:hidden}\n');
  parts.push('#s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}\n');
  parts.push('#p{white-space:pre;font-family:"Courier New",Courier,monospace;color:#e6e6e6;line-height:1;letter-spacing:0}\n');
  parts.push('#bar{position:absolute;left:0;right:0;bottom:0;padding:6px;background:rgba(192,192,192,.94);border-top:1px solid #000;display:flex;gap:8px;align-items:center;font:11px Tahoma,SimSun,sans-serif;color:#000}\n');
  parts.push('#bar button{background:#c0c0c0;border:1px solid #000;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #808080;padding:3px 12px;font:11px Tahoma,SimSun,sans-serif;min-width:52px}\n');
  parts.push('#bar span{white-space:nowrap}\n');
  parts.push('#prog{flex:1;height:10px;background:#fff;border:1px solid #000;box-shadow:inset 1px 1px 0 #808080}\n');
  parts.push('#pf{height:100%;width:0;background:#000080}\n</style>\n</head>\n<body>\n');
  parts.push('<div id="s"><pre id="p"></pre></div>\n');
  parts.push('<div id="bar"><button id="b">播放</button><span id="t">0/0</span><div id="prog"><div id="pf"></div></div><span>FPS ' + fps + '</span></div>\n');
  parts.push('<script>\n');
  parts.push('const F=' + data + ';\n');
  parts.push('const FPS=' + fps + ',W=' + w + ',H=' + h + ';\n');
  parts.push('const A=' + JSON.stringify(A) + ';\n');
  parts.push(
'let i=0,paused=!!A,au=null,last=0,dur=F.length/FPS;\n' +
'const p=document.getElementById("p"),b=document.getElementById("b"),t=document.getElementById("t"),pf=document.getElementById("pf");\n' +
'if(A){au=new Audio(A);au.preload="auto";au.loop=true;au.volume=0.7;}\n' +
'function fit(){const ww=window.innerWidth,hh=window.innerHeight-40;const s=Math.min(ww/(W*0.6),hh/H);p.style.fontSize=s+"px";p.style.lineHeight=s+"px";}\n' +
'function show(){p.innerHTML=F[i];t.textContent=(i+1)+"/"+F.length;}\n' +
'function btn(){b.textContent=paused?"播放":"暂停";}\n' +
'function toggle(){paused=!paused;if(au){if(paused){au.pause();}else{au.play().catch(function(){});}}btn();}\n' +
'b.addEventListener("click",function(e){e.stopPropagation();toggle();});\n' +
'document.addEventListener("click",function(){toggle();});\n' +
'function tick(ts){if(!paused){if(au){const ct=au.currentTime%dur;i=Math.min(F.length-1,Math.floor(ct*FPS));pf.style.width=(ct/dur*100)+"%";}else if(ts-last>=1000/FPS){last=ts;i=(i+1)%F.length;pf.style.width=((i+1)/F.length*100)+"%";}show();}requestAnimationFrame(tick);}\n' +
'fit();window.addEventListener("resize",fit);btn();show();requestAnimationFrame(tick);\n'
  );
  parts.push('</' + 'script>\n</body>\n</html>');
  return parts.join('');
}

function seekTo(time) {
  return new Promise(function (resolve) {
    let done = false;
    let to = 0;
    const finish = function () {
      if (done) return;
      done = true;
      clearTimeout(to);
      vid.removeEventListener('seeked', finish);
      resolve();
    };
    vid.addEventListener('seeked', finish);
    to = setTimeout(finish, 900);
    try { vid.currentTime = time; } catch (e) { finish(); }
  });
}

E.expAnim.addEventListener('click', async function () {
  if (!loaded) { say('还没有视频。'); return; }
  if (busy) return;
  busy = true;
  E.expAnim.disabled = true;
  pause();
  const d = vid.duration;
  if (!isFinite(d) || d <= 0) { busy = false; E.expAnim.disabled = false; say('视频还没准备好。'); return; }
  const fps = 15;
  const maxFrames = 240;
  const total = Math.min(maxFrames, Math.max(1, Math.floor(d * fps)));
  const frames = [];
  for (let i = 0; i < total; i++) {
    say('抓帧 ' + (i + 1) + ' / ' + total + '（约 ' + Math.round(d) + ' 秒的视频，请稍等）');
    await seekTo(Math.min(d - 0.02, i / fps));
    let fr = renderFrame();
    if (pixelMode()) fr = fr.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    frames.push(fr);
  }
  let audio = '';
  if (E.sound.checked) {
    say('正在提取音轨…（' + total + ' 帧已抓完）');
    try { audio = await extractAudio(total / fps); } catch (e) { audio = ''; }
    if (audio.length > 5 * 1048576) audio = '';
  }
  const page = buildPlayerHtml(frames, fps, COLS, ROWS, audio);
  const mb = (page.length / 1048576).toFixed(2);
  download(baseName() + '-ascii.html', page, 'text/html;charset=utf-8');
  const cut = d > total / fps + 0.2 ? '（已截取前 ' + (total / fps).toFixed(0) + ' 秒，视频更长请分段导）' : '';
  say('已导出动画 HTML · ' + total + ' 帧 / ' + fps + 'fps · ' + mb + ' MB' + (audio ? '（含音轨、' : '（无音轨、') + (pixelMode() ? '黑白）' : '彩色）') + '。' + cut);
  busy = false;
  E.expAnim.disabled = false;
  drawFrame();
});

function drawToRecordCanvas() {
  if (!recCtx) return;
  const t = renderFrame();
  if (!t) return;
  const cw = recCanvas.width, ch = recCanvas.height;
  recCtx.fillStyle = '#000';
  recCtx.fillRect(0, 0, cw, ch);
  recCtx.fillStyle = '#e6e6e6';
  const s = Math.min(cw / (COLS * 0.6), ch / ROWS);
  recCtx.font = s.toFixed(2) + 'px "Courier New",monospace';
  recCtx.textBaseline = 'top';
  const lines = t.split('\n');
  const cwid = s * 0.6;
  for (let y = 0; y < lines.length; y++) {
    if (pixelMode()) {
      recCtx.fillText(lines[y], 0, y * s);
    }
  }
}

E.record.addEventListener('click', function () {
  if (!loaded) { say('还没有视频。'); return; }
  if (rec) {
    rec.stop();
    return;
  }
  if (!window.MediaRecorder) { say('这个浏览器不支持 MediaRecorder，改用「导出动画 HTML」。'); return; }
  recCanvas = document.createElement('canvas');
  recCanvas.width = Math.min(1280, COLS * 8);
  recCanvas.height = Math.min(720, ROWS * 13);
  recCtx = recCanvas.getContext('2d');
  let stream;
  try {
    stream = recCanvas.captureStream(30);
  } catch (e) {
    say('无法捕获画布，改用「导出动画 HTML」。');
    return;
  }
  let withAudio = false;
  try {
    if (ensureAudio() && AC && srcNode) {
      msDest = AC.createMediaStreamDestination();
      srcNode.connect(msDest);
      const at = msDest.stream.getAudioTracks();
      for (let i = 0; i < at.length; i++) stream.addTrack(at[i]);
      withAudio = at.length > 0;
    }
  } catch (e) { withAudio = false; }
  const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  let mime = '';
  for (let i = 0; i < types.length; i++) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) { mime = types[i]; break; }
  }
  try {
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  } catch (e) {
    say('录制启动失败：' + e.message);
    rec = null;
    return;
  }
  recChunks = [];
  rec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = function () {
    try { if (srcNode && msDest) srcNode.disconnect(msDest); } catch (e) {}
    msDest = null;
    const blob = new Blob(recChunks, { type: rec.mimeType || 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = baseName() + '-ascii.webm';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    E.record.textContent = '录制 WebM';
    say('已保存录制文件（' + (blob.size / 1048576).toFixed(2) + ' MB）。' + (withAudio ? ' 含音轨。' : ' 无音轨（浏览器没给音频轨道）。'));
    rec = null;
    recCtx = null;
  };
  rec.start(1000);
  E.record.textContent = '■ 停止录制';
  say('录制中（' + (withAudio ? '带声音' : '仅画面') + '）：从头播放，播完点「停止录制」。');
  vid.currentTime = 0;
  play();
});
